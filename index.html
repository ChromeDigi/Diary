<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Diary</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="app" id="app">
    <aside class="sidebar">
      <header class="sidebar-head">
        <h1>My <span>Diary</span></h1>
        <div class="toggles">
          <button id="themeBtn" class="icon" aria-label="Switch theme"></button>
          <button id="calmBtn" class="icon" aria-label="Calm mode" aria-pressed="false">🌙</button>
        </div>
      </header>
      <div class="new-row">
        <button id="checkinBtn" class="primary">+ Check in</button>
        <button id="newBtn" class="ghost">New entry</button>
      </div>
      <button id="reportBtn" class="report-link">📊 This week's report</button>
      <input id="search" type="search" placeholder="Search entries…" aria-label="Search entries">
      <ul id="entryList" class="entry-list"></ul>
      <p id="emptyList" class="muted empty" hidden>No entries yet. Write your first one!</p>
      <footer class="sidebar-foot">
        <button id="exportBtn" class="ghost">Export backup</button>
        <label class="ghost file-btn">Import backup
          <input id="importInput" type="file" accept="application/json" hidden>
        </label>
      </footer>
    </aside>

    <main class="editor" id="editor">
      <div id="placeholder" class="placeholder">
        <p>Select an entry or start a new one.</p>
      </div>

      <form id="entryForm" hidden autocomplete="off">
        <div class="editor-top">
          <button type="button" id="backBtn" class="ghost back">← Entries</button>
          <input id="date" type="date" aria-label="Date">
        </div>
        <section class="checkin" aria-label="Daily check-in">
          <div class="checkin-head">
            <h2>Check-in</h2>
            <span id="doneBadge" class="done" hidden>Check-in done ✓</span>
          </div>
          <div class="moods" id="moods" role="radiogroup" aria-label="Mood"></div>
          <div class="scales" id="scales"></div>
          <div class="themes" id="themes"></div>
          <input id="oneLiner" class="one-liner" placeholder="Biggest thing today" aria-label="Biggest thing today" maxlength="140">
        </section>
        <input id="title" class="title" placeholder="Title" aria-label="Title">
        <textarea id="body" placeholder="Dear diary…" aria-label="Entry"></textarea>
        <div class="editor-foot">
          <span id="status" class="muted"></span>
          <button type="button" id="deleteBtn" class="danger">Delete</button>
        </div>
      </form>

      <section id="report" class="report" hidden aria-label="Weekly report">
        <div class="report-top">
          <button type="button" id="reportBack" class="ghost back">← Entries</button>
          <div class="week-nav">
            <button type="button" id="prevWeek" class="icon" aria-label="Previous week">‹</button>
            <div>
              <h2 id="weekTitle"></h2>
              <span id="weekTag" class="muted"></span>
            </div>
            <button type="button" id="nextWeek" class="icon" aria-label="Next week">›</button>
          </div>
          <div class="report-actions">
            <button type="button" id="thisWeekBtn" class="ghost">This week</button>
            <label class="week-start">Week starts
              <select id="weekStart"></select>
            </label>
            <button type="button" id="printBtn" class="primary">Print / save PDF</button>
          </div>
        </div>

        <div id="tiles" class="tiles"></div>

        <div class="report-grid">
          <div class="rcard wide">
            <h3>How the week went</h3>
            <div id="legend" class="legend"></div>
            <div id="chart" class="chart"></div>
          </div>
          <div class="rcard">
            <h3>Mood each day</h3>
            <div id="strip" class="strip"></div>
          </div>
          <div class="rcard">
            <h3>Top themes</h3>
            <div id="topThemes"></div>
          </div>
          <div class="rcard wide">
            <h3>Highlights</h3>
            <ul id="highlights" class="highlights"></ul>
          </div>
          <div class="rcard wide notes">
            <div class="notes-head">
              <h3>Notes for therapy</h3>
              <button type="button" id="refillBtn" class="ghost">Refill from entries</button>
            </div>
            <div id="notes"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="report.js"></script>
</body>
</html>
